name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    # The CLA is for outside contributors. Pull requests opened by the project (owner, members,
    # collaborators) or by bots such as Dependabot skip it; a skipped required check counts as passing.
    # Commits in project PRs may be authored by tools working for the owner (e.g. the `claude` account).
    # Event payloads report a private org membership as CONTRIBUTOR, so maintainers are also named.
    if: >-
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association || github.event.issue.author_association)
      && !contains(fromJSON('["JoeTheChode"]'), github.event.pull_request.user.login || github.event.issue.user.login)
      && (github.event.pull_request.user.type || github.event.issue.user.type) != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Check CLA signatures
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: ${{ github.server_url }}/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: JoeTheChode,dependabot[bot]
