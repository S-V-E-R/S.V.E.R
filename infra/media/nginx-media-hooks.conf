# SRS publish/unpublish hooks -> API. Loopback only. The secret header comes from a root-only file
# outside git; proxy_bind gives hooks their own source address (STREAM_HOOK_IP=127.0.0.2), so public
# traffic, which reaches the API from 127.0.0.1, can never pass the API's hook-peer check.
server {
    listen 127.0.0.1:18089;
    access_log off;
    location /api/internal/srs/ {
        include /etc/nginx/sver-rebuild-hook-secret.conf;
        proxy_bind 127.0.0.2;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    location / {
        return 404;
    }
}
