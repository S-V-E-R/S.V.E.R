# Included inside the stream.sver.tv HTTPS server. Rebuild playback only; the legacy /live/ routes
# are unchanged. stream.sver.tv points straight at the server (not through Cloudflare).
# WHEP: POST /rebuild/whep/?app=rebuild&stream=<public id> -> SRS /rtc/v1/whep/ (SRS answers CORS).
location = /_rebuild_playback_auth {
    internal;
    access_log off;
    include /etc/nginx/sver-rebuild-hook-secret.conf;
    proxy_bind 127.0.0.2;
    proxy_pass http://127.0.0.1:18080/api/internal/streams/playback;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Cookie "";
    proxy_cache off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 3s;
}
location ^~ /rebuild/whep/ {
    auth_request /_rebuild_playback_auth;
    access_log off;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:1986/rtc/v1/whep/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_cache off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
}
# WHIP ingest (OBS 30+): POST /rebuild/whip/?app=rebuild&stream=<public id> with the stream key as
# the bearer token. The key is moved into SRS's `key` parameter (what the publish hook checks, as for
# RTMP), so it never appears in a URL the client sends or a log. SRS's resource URL for the DELETE
# that ends the stream is rewritten to this path; a DELETE passes its own arguments through.
location ^~ /rebuild/whip/ {
    access_log off;
    client_max_body_size 64k;
    set $whip_key "";
    if ($http_authorization ~ "^Bearer ([A-Za-z0-9_-]{43})$") {
        set $whip_key $1;
    }
    set $whip_args "app=rebuild&stream=$arg_stream&key=$whip_key";
    if ($arg_stream !~ "^[A-Za-z0-9_-]{1,64}$") {
        set $whip_args "";
    }
    if ($request_method = DELETE) {
        set $whip_args $args;
    }
    proxy_pass http://127.0.0.1:1986/rtc/v1/whip/?$whip_args;
    proxy_redirect /rtc/v1/whip/ /rebuild/whip/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}
# HLS: /rebuild/<public id>.m3u8 and its segments. Playlists must stay fresh. Segments never change
# once written, so the CDN (cdn.sver.tv, which pulls from here) may keep them briefly; a stopped
# stream still ends at once because its playlist is refused.
location ^~ /rebuild/ {
    auth_request /_rebuild_playback_auth;
    access_log off;
    limit_except GET HEAD OPTIONS { deny all; }
    proxy_pass http://127.0.0.1:8090;
    proxy_cache off;
    proxy_hide_header Cache-Control;
    # SRS sends its own permissive CORS headers; a second Allow-Origin makes browsers refuse the
    # response (hls.js, unlike native HLS, enforces CORS). Only ours goes out.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Request-Private-Network;
    add_header Access-Control-Allow-Origin "https://sver.tv" always;
    add_header Cache-Control "no-store" always;
    location ~ \.ts$ {
        auth_request /_rebuild_playback_auth;
        limit_except GET HEAD OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:8090;
        add_header Access-Control-Allow-Origin "https://sver.tv" always;
        add_header Cache-Control "public, max-age=60, immutable" always;
    }
}
