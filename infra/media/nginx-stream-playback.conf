# Included inside the stream.sver.tv HTTPS server. Rebuild playback only; the legacy /live/ routes
# are unchanged. stream.sver.tv points straight at the server (not through Cloudflare).
# WHEP: POST /rebuild/whep/?app=rebuild&stream=<public id> -> SRS /rtc/v1/whep/ (SRS answers CORS).
location ^~ /rebuild/whep/ {
    access_log off;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:1986/rtc/v1/whep/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
# HLS: /rebuild/<public id>.m3u8 and its segments. Playlists must stay fresh.
location ^~ /rebuild/ {
    access_log off;
    limit_except GET HEAD OPTIONS { deny all; }
    proxy_pass http://127.0.0.1:8090;
    add_header Access-Control-Allow-Origin "https://sver.tv" always;
    add_header Cache-Control "no-cache" always;
}
