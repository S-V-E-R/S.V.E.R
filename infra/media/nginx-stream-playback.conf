# Included inside the stream.sver.tv HTTPS server. Rebuild playback only; the legacy /live/ routes
# are unchanged. stream.sver.tv points straight at the server (not through Cloudflare).
# WHEP: POST /rebuild/whep/?app=rebuild&stream=<public id> -> SRS /rtc/v1/whep/ (SRS answers CORS).
location = /_rebuild_playback_auth {
    internal;
    access_log off;
    include /etc/nginx/sver-rebuild-hook-secret.conf;
    proxy_bind 127.0.0.2;
    proxy_pass http://127.0.0.1:18080/api/internal/streams/playback;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Cookie "";
    proxy_cache off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 3s;
}
location ^~ /rebuild/whep/ {
    auth_request /_rebuild_playback_auth;
    access_log off;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:1986/rtc/v1/whep/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_cache off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
}
# HLS: /rebuild/<public id>.m3u8 and its segments. Playlists must stay fresh.
location ^~ /rebuild/ {
    auth_request /_rebuild_playback_auth;
    access_log off;
    limit_except GET HEAD OPTIONS { deny all; }
    proxy_pass http://127.0.0.1:8090;
    proxy_cache off;
    proxy_hide_header Cache-Control;
    add_header Access-Control-Allow-Origin "https://sver.tv" always;
    add_header Cache-Control "no-store" always;
}
