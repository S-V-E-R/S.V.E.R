# S.V.E.R Module 3 media server (docs/LIVE_STREAMS.md). Separate from the legacy SRS, which keeps
# 1935/tcp, 8000/udp and SRT 10080/udp. Public: RTMP 1936/tcp (OBS), WebRTC 8001/udp (WHEP playback
# and WHIP ingest) and SRT 10081/udp. Loopback only: the HTTP
# API (1986, used by the API and the WHEP proxy) and HLS (8090, behind the stream.sver.tv proxy).
# Only the `rebuild` app is accepted: the API's publish hook rejects anything else.
listen 1936;
max_connections 1000;
daemon off;
srs_log_tank console;
srs_log_level warn;

http_api {
    enabled on;
    listen 127.0.0.1:1986;
}
http_server {
    enabled on;
    listen 127.0.0.1:8090;
    dir /media;
}
rtc_server {
    enabled on;
    listen 8001;
    # The server's public IPv4, from the external environment (never committed).
    candidate $CANDIDATE;
}
# SRT ingest: the stream ID carries the key (#!::r=rebuild/<public id>?key=<key>,m=publish).
srt_server {
    enabled on;
    listen 10081;
}

vhost __defaultVhost__ {
    # Playback goes through the API's leases (HLS and WHEP behind nginx, both loopback to SRS). RTMP
    # play is only for the API's local pulls (restreaming, recording); without this anyone with a
    # public id could watch rtmp://...:1936/rebuild/<id> directly. Allow rules only: in SRS a deny
    # rule wins over any allow, so `deny play all` would block loopback too.
    security {
        enabled on;
        allow publish all;
        allow play 127.0.0.1;
    }
    rtc {
        enabled on;
        rtmp_to_rtc on;
        # WHIP ingest feeds RTMP, HLS and recording too; SRS turns its Opus audio into AAC.
        rtc_to_rtmp on;
    }
    srt {
        enabled on;
        srt_to_rtmp on;
    }
    play {
        gop_cache off;
    }
    hls {
        enabled on;
        hls_path /media;
        hls_ctx off;
        hls_fragment 1;
        hls_window 12;
        hls_wait_keyframe on;
        hls_dispose 30;
        hls_ts_file [app]/[stream]-[timestamp]-[seq].ts;
    }
    # The local hook proxy adds the shared secret and connects from 127.0.0.2
    # (infra/media/nginx-media-hooks.conf); the API checks both.
    http_hooks {
        enabled on;
        on_publish http://127.0.0.1:18089/api/internal/srs/publish;
        on_unpublish http://127.0.0.1:18089/api/internal/srs/unpublish;
        on_hls http://127.0.0.1:18089/api/internal/srs/segment;
    }
}
