server {
    listen 80;
    server_name sver.tv www.sver.tv;
    return 301 https://sver.tv$request_uri;
}

server {
    listen 127.0.0.1:4443 ssl proxy_protocol;
    server_name www.sver.tv;
    ssl_certificate /etc/ssl/cloudflare/sver.tv-origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/sver.tv-origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://sver.tv$request_uri;
}

server {
    listen 127.0.0.1:4443 ssl proxy_protocol;
    server_name sver.tv;
    ssl_certificate /etc/ssl/cloudflare/sver.tv-origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/sver.tv-origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 16k;

    # Chat WebSocket: same origin, upgraded; the API checks Origin and the session cookie.
    location = /api/chat/ws {
        access_log off;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
    }
    # Module 2 image uploads only: avatar, banner, sponsor logo and fan art. The API enforces the
    # same 11 MB limit on these routes and 16-64 KB everywhere else.
    location ~ ^/api/(me/avatar|me/banner|me/sponsors/[^/]+/logo|me/setup/photos|channels/[A-Za-z0-9_]+/fan-art)$ {
        client_max_body_size 11m;
        access_log off;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Powered-By;
    }
    location /api/ {
        # OAuth callback codes and state must not enter access logs.
        access_log off;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Powered-By;
    }
    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Powered-By;
    }
}
