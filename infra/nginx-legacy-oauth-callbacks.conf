# Include inside the api.sver.tv HTTPS server. Only these callbacks move to the rebuild.
# Keep the exact registered URI for OAuth exchange, then return to host-only browser cookies.
location = /api/auth/oauth/google/callback {
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    return 303 https://sver.tv/api/auth/oauth/google/callback$is_args$args;
}
location = /api/auth/oauth/twitch/callback {
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    return 303 https://sver.tv/api/auth/oauth/twitch/callback$is_args$args;
}
location = /api/auth/oauth/discord/callback {
    access_log off;
